<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#5b3df5" />
    <title>Lanet: share files on your Wi-Fi</title>
    <meta name="description" content="Send files, folders and text between devices on the same Wi-Fi. Straight from device to device. No uploads, nothing to install." />
    <link rel="canonical" href="https://lanet.workdesk.workers.dev/" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable as an app: Chrome and Edge read the manifest; iPhone and iPad read the apple- tags
         when added to the Home Screen, and then open Lanet full-screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lanet" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The preview shown when the link is shared (WhatsApp, Facebook, LinkedIn, Telegram, Slack…).
         Apps fetch it from the server, so the room id after # is never part of what they see. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lanet" />
    <meta property="og:url" content="https://lanet.workdesk.workers.dev/" />
    <meta property="og:title" content="Lanet: share files on your Wi-Fi" />
    <meta property="og:description" content="Send files, folders and text between devices on the same Wi-Fi. Straight from device to device. No uploads, nothing to install." />
    <meta property="og:image" content="https://lanet.workdesk.workers.dev/og.jpg" />
    <meta property="og:image:secure_url" content="https://lanet.workdesk.workers.dev/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lanet: share files on your Wi-Fi, straight from device to device." />
    <meta property="og:locale" content="en_US" />
    <!-- X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lanet: share files on your Wi-Fi" />
    <meta name="twitter:description" content="Send files, folders and text between devices on the same Wi-Fi. No uploads, nothing to install." />
    <meta name="twitter:image" content="https://lanet.workdesk.workers.dev/og.jpg" />
    <meta name="twitter:image:alt" content="Lanet: share files on your Wi-Fi, straight from device to device." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
